name: Backend Test CI - 연습용입니

# trigger
on:
  pull_request:
    branches: [ "backend/develop" ] # PR을 날렸을 때
    paths:
      - 'gonggoo/src/**'
  #push:
  #   branches: [ "backend/develop" ] # 해당 브랜치에 푸시될 때
  #   paths:
  #     - 'backend/**' # backend 폴더 내용이 바뀔 때만 실행 (불필요한 실행 방지)

jobs:
  test:
    runs-on: ubuntu-latest
    
    # [중요] 모든 명령어를 'backend' 폴더 안에서 실행하도록 설정
    defaults:
      run:
        working-directory: ./backend

    steps:
    # 1. 코드 내려받기
    - uses: actions/checkout@v4

    # 2. Java 세팅
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 3. Gradle 세팅 및 캐싱
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. 테스트 실행 (가장 중요한 단계!)
    - name: Run Tests
      run: ./gradlew test
