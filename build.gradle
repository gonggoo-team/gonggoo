plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
	// QueryDSL 플러그인을 제거합니다.
}

group = 'com.gonggoo'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 공구글 추가시 필요한 의존성(for not blank, size)
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'

	// QueryDSL 코드 생성기를 annotationProcessor에 둡니다.
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"

	// Lombok 등 다른 annotationProcessor는 그대로 둡니다.
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	annotationProcessor 'org.projectlombok:lombok'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ▼▼▼ 새로운 QueryDSL 표준 설정 ▼▼▼

// 1. Q-Type 파일이 생성될 폴더를 지정합니다.
def generated = 'src/main/generated'

// 2. compileJava 작업 시 생성될 폴더를 사용하도록 설정합니다.
tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(generated))
}

// 3. 생성된 폴더를 소스 폴더로 인식시킵니다.
sourceSets {
	main {
		java {
			srcDirs += [generated]
		}
	}
}

// 4. clean 작업 시 생성된 폴더도 함께 삭제되도록 설정합니다.
clean {
	delete file(generated)
}