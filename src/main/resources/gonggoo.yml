spring:
  jackson :
    deserialization:
      accept-timestamp-for-timestamps : true
  datasource:
    # H2 인메모리 데이터베이스 URL
    url: jdbc:h2:mem:gonggoo_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    # H2 드라이버로 변경
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 애플리케이션 시작 시 테이블 자동 생성 및 종료 시 삭제
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: true # SQL 쿼리 출력

  h2:
    console:
      # H2 콘솔 활성화 (웹에서 DB 확인 가능)
      enabled: true

logging.level:
  org.hibernate.SQL: debug