spring:
  config:
    activate:
      on-profile: test

  datasource:
    # DB_CLOSE_DELAY=-1 추가: 테스트 도중 DB가 닫히지 않도록 방지
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 👇 [핵심] 이 설정이 빠져서 에러가 난 것입니다!
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

# JWT 설정
jwt:
  issuer: gonggoo
  secret: "test-secret-key-must-be-long-enough-for-hs256-algorithm-at-least-32-bytes"
  expireSeconds: 3600
  refreshExpireSeconds: 3600

logging:
  level:
    org.hibernate.SQL: info